<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World Politics Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>World Politics Dashboard</h1>
      <p class="sub">Political systems, elections and economic data for every country. Refreshed daily from open data.</p>
    </div>
    <div class="updated" id="updated">Loading…</div>
  </header>

  <section class="kpis" id="kpis" aria-label="Summary"></section>

  <section class="panel">
    <div class="panel-head">
      <h2>Upcoming elections</h2>
      <div class="seg" role="tablist" aria-label="Time window">
        <button data-days="90" class="on">90 days</button>
        <button data-days="365">12 months</button>
        <button data-days="1825">5 years</button>
      </div>
    </div>
    <div class="legend" id="kind-legend"></div>
    <div id="upcoming" class="timeline"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Countries</h2>
      <span class="muted" id="row-count"></span>
    </div>
    <div class="filters">
      <input id="q" type="search" placeholder="Search country, capital, leader…" aria-label="Search">
      <select id="region" aria-label="Region"><option value="">All regions</option></select>
      <select id="system" aria-label="System"><option value="">All systems</option></select>
    </div>
    <div class="table-scroll">
      <table id="tbl">
        <thead><tr>
          <th data-k="name">Country</th>
          <th data-k="population" class="num">Population</th>
          <th data-k="gdp" class="num">GDP (US$)</th>
          <th data-k="gdppc" class="num">GDP / capita</th>
          <th data-k="currency">Currency</th>
          <th data-k="fx" class="num">per 1 USD</th>
          <th data-k="system">System</th>
          <th data-k="seats" class="num">Legislature seats</th>
          <th data-k="next">Next election</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <footer class="foot" id="foot"></footer>
</div>

<dialog id="detail" aria-labelledby="d-title">
  <div class="d-inner">
    <button class="close" id="d-close" aria-label="Close">×</button>
    <div id="d-body"></div>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
